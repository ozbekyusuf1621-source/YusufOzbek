        <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
            <h3>İletişim Formu</h3>
            <br>
            <label>Adınız:</label><br>

            <textarea rows="4" style="width: 100%; padding: 8px; margin-bottom: 10px;"></textarea>

        </div>

        <!-- JAVASCRIPT QUİZ ALANI -->
        <div style="background: white; padding: 20px; border-radius: 8px;">
            <h3>Test: Hangi Formayı Almalısın?</h3>
            <br>
            <p>Soru: Hangi renkleri daha çok seviyorsun?</p>
            <br>
            <select id="renkSecimi" style="padding: 8px;">
                <option value="sec">Seçiniz...</option>
                <option value="sari-lacivert">Sarı - Lacivert</option>
                <option value="sari-kirmizi">Sarı - Kırmızı</option>
                <option value="siyah-beyaz">Siyah - Beyaz</option>
            </select>
            <br><br>
            <button id="quizButon" class="buton">Sonucu Gör</button>
            <p id="quizSonuc" style="font-weight: bold; margin-top: 15px;"></p>
        </div>
